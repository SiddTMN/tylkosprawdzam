name: Macro calendar and Pages

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/macro-calendar.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'js/calendar*.js'
      - 'js/treasury-model.js'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/macro-calendar.yml'

permissions:
  contents: read

concurrency:
  group: macro-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Test calendar and generator
        run: node --test tests/*.test.js

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      # Main may have advanced while the run was queued. Test checked-out code too.
      - name: Test current main
        run: node --test tests/*.test.js
      - name: Generate FinanceCalendar and TreasuryDirect JSON
        run: node scripts/generate-macro-calendar.cjs
      - name: Commit only validated calendar data
        run: |
          git add -- data/macro-calendar.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update macro calendar data'
            # Fail on concurrent changes; never force-push or overwrite newer code.
            git push origin HEAD:main
          fi
      - name: Configure existing Pages site
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Package public site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R css js data _site/
      # GITHUB_TOKEN pushes do not trigger another Pages build: deploy directly.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
